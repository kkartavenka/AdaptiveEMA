<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img"><title>Live prediction score — lower is better</title><rect x="0" y="0" width="960" height="430" fill="#ffffff"/><text x="68" y="21" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Live prediction score — lower is better</text><text x="68" y="38" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">each filter's output at n, scored as a prediction of the raw value at n+1, relative to using the raw value at n</text><line x1="68" y1="346" x2="942" y2="346" stroke="#e4e8ed" stroke-width="1"/><text x="60" y="349.5" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#656d76">0</text><line x1="68" y1="253" x2="942" y2="253" stroke="#e4e8ed" stroke-width="1"/><text x="60" y="256.5" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#656d76">0.5</text><line x1="68" y1="160" x2="942" y2="160" stroke="#e4e8ed" stroke-width="1"/><text x="60" y="163.5" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#656d76">1</text><line x1="68" y1="66.9" x2="942" y2="66.9" stroke="#e4e8ed" stroke-width="1"/><text x="60" y="70.4" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#656d76">1.5</text><line x1="68" y1="346" x2="942" y2="346" stroke="#656d76" stroke-width="1"/><line x1="68" y1="54" x2="68" y2="346" stroke="#656d76" stroke-width="1"/><text x="505" y="379" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2328"></text><text x="16" y="200" text-anchor="middle" font-family="ui-sans-seri